<!DOCTYPE html>
<html lang="en">


<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab 2</title>
  
  <style>
    :root {
      --primary-color: #e09e43;
      --secondary-color: #a4acb4;
      --third-color:rgb(235 235 235);
      --success-color: #28a745;
      --danger-color: #dc3545;
      --warning-color: #ffc107;
      --light-color: #f8f9fa;
      --dark-color: #343a40;
    }

    *{
        box-sizing: border-box;
    }

    body{
        background-color: var(--secondary-color);
            display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

    }

    form{
        display: grid;
        gap: 2vh;
        padding: 1vh;
        background-color: var(--dark-color);
        color: var(--light-color);
    }

    button{

        border-radius: 1vh;
        border-width: 1px;
        line-height: 3vh;
        padding: 4px;
        width: fit-content;
    }

    fieldset{
        border:none;
        border-radius: 1vh;
        background-color: var(--third-color);
    }
    
    form > fieldset > div{
            display: grid;
            gap:2px;
        text-align: start;
        padding-block:1vh;
        

        &>label{
            color: var(--dark-color);
        }
    }

    .flexbox{
        display: flex;
        gap: 1vh;
        align-items: center;
    }

    
    button:hover, input:hover{
        cursor: pointer;
    }


    input{
        border-radius: 4px;
        border-width: 1px;
        line-height: 2em;
    }

    input:invalid{
        border-color: var(--warning-color);
    }

    legend{
        background-color: white;
        color: var(--primary-color);
        padding: 1vh;
        border-radius: 1vh;
    }

  </style>

</head>


<body>
    
    <form >
        <div>Formulário de Inscrição</div>
        <fieldset >
            <legend>Dados pessoais</legend>
                <div>
                    <label for="fullName">Nome Completo:</label>
                    <input id="fullName" name="fullName" type="text" required minlength="5">
                </div>
                <div>
                    <label for="email">E-mail:</label>
                    <input id="email" name="email" type="email" required>
                </div>
                <div>
                <label for="password">Senha:</label>
                <input id="password" name="password" type="password" required minlength="8">
            </div>
                <div>
                    <label for="phone">Telefone:</label>
                    <input id="phone" name="phone" type="number" pattern="^\([0-9]{2}\) [0-9]{5}-[0-9]{4}$" 
                    placeholder="(XX) XXXXX-XXXX">
                </div>
                <div>
                    <label for="birthDate">Data de Nascimento:</label>
                    <input id="birthDate" name="birthDate" type="date" required>
                </div>

        <div class="flexbox">
                <label for="experience">Nível de Experiência:</label>
                <input id="experience" name="experience" type="range" min="1" max="10" value="5">
        </div>
        </fieldset>

        <fieldset>
            <legend>Preferências do Evento</legend>
                <div class="flexbox">
                    <label for="guests">Nº de Convidados:</label> 
                    <input style="width:40px" id="guests" name="guests" type="number" min="0" max="5">
                </div>
                <div>
                    <label for="portfolio">URL do Portfólio:</label>
                    <input id="portfolio" name="portfolio" type="url">
                </div>
            
        </fieldset>
        <button type="submit">Enviar</button>
    </form>
    
    </body>
</html>
