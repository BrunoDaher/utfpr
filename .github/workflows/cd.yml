name: CD - Deploy Continuo GitHub Pages

on:
  push:
    branches: [ main, master, gh-pages ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'
          cache-dependency-path: Disciplina3/Projeto/projeto-final/yarn.lock

      - name: Instalar Dependencias
        working-directory: Disciplina3/Projeto/projeto-final
        run: yarn install --frozen-lockfile

      - name: Build de Producao
        working-directory: Disciplina3/Projeto/projeto-final
        run: yarn build

      - name: Preparar pasta de deploy
        run: |
          mkdir -p _site
          rsync -a \
            --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='_site' \
            --exclude='node_modules' \
            --exclude='src' \
            --exclude='tests' \
            --exclude='test-results' \
            --exclude='playwright-report' \
            ./ _site/

          cp Disciplina3/Projeto/projeto-final/dist/index.html Disciplina3/Projeto/projeto-final/dist/404.html
          cp -r Disciplina3/Projeto/projeto-final/dist/. _site/
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
