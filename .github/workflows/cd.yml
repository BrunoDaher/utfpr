name: CD - Deploy Continuo GitHub Pages

on:
  push:
    branches: [ main, master, gh-pages ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Disciplina3/Projeto/projeto-final

    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'
          cache-dependency-path: Disciplina3/Projeto/projeto-final/yarn.lock

      - name: Instalar Dependencias
        run: yarn install --frozen-lockfile

      - name: Build de Producao
        run: yarn build

      - name: Fallback SPA para GitHub Pages (404.html)
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'Disciplina3/Projeto/projeto-final/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
