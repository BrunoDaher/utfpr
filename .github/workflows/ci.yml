name: CI - Integracao Continua

on:
  push:
    branches: [ main, master, gh-pages ]
  pull_request:
    branches: [ main, master, gh-pages ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Disciplina3/Projeto/projeto-final

    steps:
      - name: Checkout Repositorio
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'
          cache-dependency-path: Disciplina3/Projeto/projeto-final/yarn.lock

      - name: Instalar Dependencias
        run: yarn install --frozen-lockfile

      - name: Checagem de Tipagem Estrita
        run: npx tsc -b

      - name: Testes Unitarios e Componentes (Vitest)
        run: yarn test:run

      - name: Instalar Navegadores do Playwright
        run: yarn playwright install --with-deps chromium

      - name: Testes Ponta a Ponto (Playwright E2E)
        run: yarn test:e2e
