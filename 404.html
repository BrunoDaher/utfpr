<!DOCTYPE html>
<html lang="pt-BR">
  <head>

    <title>Redirecionando...</title>
    <script>
      const path = window.location.pathname;
      const targetBase = '/utfpr/projetoReact/dist/';

        window.location.replace(targetBase);
      } else {
        window.location.replace('/utfpr/');

  </head>

</html>
